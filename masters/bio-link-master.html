<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- =========================

========================= -->
<title>{{NAMA_USAHA}} | Bio Link Resmi</title>
<meta name="description" content="{{DESKRIPSI_SINGKAT}}">
<meta name="robots" content="index, follow">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Poppins, sans-serif;
  background:radial-gradient(circle at top,#111,#000);
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:30px 16px;
}

/* ===== CARD ===== */
.card{
  max-width:420px;
  width:100%;
  background:#0b0b0b;
  border-radius:26px;
  padding:36px 26px 30px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,215,0,.25);
}

/* ===== AVATAR ===== */
.avatar{
  width:96px;
  height:96px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffcc00,#ff9900);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:800;
  color:#000;
  margin:0 auto 18px;
}

/* ===== HEADER ===== */
.name{
  font-size:22px;
  font-weight:700;
  margin-bottom:6px;
}
.tagline{
  font-size:14px;
  color:#ccc;
  margin-bottom:26px;
  line-height:1.5;
}

/* ===== LINKS ===== */
.links{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.link{
  display:block;
  padding:14px 18px;
  background:#111;
  border-radius:14px;
  text-decoration:none;
  color:#fff;
  font-weight:600;
  border:1px solid rgba(255,215,0,.25);
  transition:.25s;
}
.link:hover{
  background:#ffd369;
  color:#000;
  transform:translateY(-2px);
}

/* ===== BADGE ===== */
.badge{
  margin:26px auto 18px;
  display:inline-block;
  padding:8px 18px;
  background:#111;
  border-radius:30px;
  font-size:13px;
  color:#ffd369;
  border:1px solid rgba(255,215,0,.25);
}

/* ===== FOOTER ===== */
footer{
  margin-top:22px;
  font-size:12px;
  color:#aaa;
}

/* ===== MOBILE ===== */
@media(max-width:420px){
  .card{padding:30px 20px}
}
</style>
</head>

<body>

<div class="card">

  <!-- =========================
       PLACEHOLDER PROFIL
  ========================= -->
  <div class="avatar">{{INISIAL}}</div>

  <div class="name">{{NAMA_USAHA}}</div>
  <div class="tagline">
    {{TAGLINE_1}}<br>
    {{TAGLINE_2}}
  </div>

  <!-- =========================
       PLACEHOLDER LINK
  ========================= -->
  <div class="links">
    <a class="link" href="https://wa.me/{{NOMOR_WA}}?text={{TEKS_WA}}">💬 Chat WhatsApp</a>
    <a class="link" href="{{LINK_INSTAGRAM}}">📸 Instagram</a>
    <a class="link" href="{{LINK_KATALOG}}">📦 Katalog / Produk</a>
    <a class="link" href="{{LINK_LOKASI}}">📍 Lokasi Usaha</a>
  </div>

  <div class="badge">{{BADGE_TEXT}}</div>

  <footer>
    {{FOOTER_TEXT}}
  </footer>

</div>

</body>
</html>
