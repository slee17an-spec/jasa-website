<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- =========================
     PLACEHOLDER SEO
========================= -->
<title>{{NAMA_USAHA}} | {{JENIS_USAHA}} {{KOTA_LAYANAN}}</title>
<meta name="description" content="{{DESKRIPSI_SEO}}">
<meta name="robots" content="index, follow">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Poppins, sans-serif;
  background:radial-gradient(circle at top,#111,#000);
  color:#fff;
}

/* ===== HERO ===== */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
.hero-box{
  max-width:820px;
  width:100%;
  background:#0b0b0b;
  border-radius:26px;
  padding:50px 40px;
  text-align:center;
  box-shadow:0 0 40px rgba(255,215,0,.25);
}
h1{
  font-size:42px;
  font-weight:800;
  margin-bottom:14px;
  background:linear-gradient(90deg,#ffd369,#ffffff,#ffd369);
  -webkit-background-clip:text;
  color:transparent;
}
.subtitle{
  font-size:18px;
  color:#ddd;
  line-height:1.6;
  margin-bottom:28px;
}

/* ===== BADGES ===== */
.badges{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:32px;
}
.badge{
  background:#111;
  padding:10px 18px;
  border-radius:30px;
  font-size:14px;
  color:#ffd369;
  border:1px solid rgba(255,215,0,.25);
}

/* ===== CTA ===== */
.cta a{
  display:inline-block;
  padding:18px 44px;
  background:linear-gradient(45deg,#ffcc00,#ff9900);
  color:#000;
  border-radius:50px;
  font-size:18px;
  font-weight:700;
  text-decoration:none;
  box-shadow:0 8px 20px rgba(255,200,0,.4);
}

/* ===== SERVICES ===== */
.services{
  margin-top:38px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}
.services div{
  background:#111;
  padding:16px;
  border-radius:14px;
  font-size:14px;
  color:#ccc;
}

/* ===== FOOTER ===== */
footer{
  margin-top:34px;
  font-size:13px;
  color:#aaa;
}

/* ===== MOBILE ===== */
@media(max-width:600px){
  .hero-box{padding:36px 22px}
  h1{font-size:32px}
  .subtitle{font-size:16px}
}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-box">

    <!-- =========================
         PLACEHOLDER UTAMA
    ========================= -->
    <h1>{{JUDUL_UTAMA}}</h1>

    <p class="subtitle">
      {{DESKRIPSI_SINGKAT}}<br>
      {{USP_1}} • {{USP_2}} • {{USP_3}}
    </p>

    <div class="badges">
      <div class="badge">✔ {{BADGE_1}}</div>
      <div class="badge">✔ {{BADGE_2}}</div>
      <div class="badge">✔ {{BADGE_3}}</div>
    </div>

    <div class="cta">
      <a href="https://wa.me/{{NOMOR_WA}}?text={{TEKS_WA}}">
        {{TEKS_TOMBOL_WA}}
      </a>
    </div>

    <div class="services">
      <div>🔧 {{LAYANAN_1}}</div>
      <div>⚡ {{LAYANAN_2}}</div>
      <div>💬 {{LAYANAN_3}}</div>
      <div>🕒 {{LAYANAN_4}}</div>
    </div>

    <footer>
      {{FOOTER_TEXT}}
    </footer>

  </div>
</section>

</body>
</html>
