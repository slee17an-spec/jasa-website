<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kontak Profesional | Tolitoli</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kontak profesional jasa & layanan di Tolitoli. Pendekatan tenang, jelas, dan tanpa tekanan.">

<style>
:root{
  --bg:#020617;
  --ink:#e5e7eb;
  --soft:#94a3b8;
  --line:#1e293b;
  --accent:#22c55e;
}

*{box-sizing:border-box}

html,body{
  height:100%;
}

body{
  margin:0;
  font-family:system-ui,Arial,sans-serif;
  background:radial-gradient(circle at top, #020617, #000);
  color:var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
}

.screen{
  max-width:640px;
  width:100%;
  padding:48px 32px;
  text-align:center;
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(2,6,23,.6);
  backdrop-filter:blur(6px);
}

h1{
  font-size:2.2rem;
  margin:0 0 14px;
  letter-spacing:.3px;
}

p{
  margin:0 0 32px;
  color:var(--soft);
  font-size:1.05rem;
}

.options{
  display:grid;
  gap:18px;
}

.option{
  padding:16px;
  border-radius:999px;
  border:1px solid var(--line);
  text-decoration:none;
  color:var(--ink);
  font-weight:600;
  transition:.2s;
}

.option:hover{
  border-color:var(--accent);
  color:var(--accent);
}

.option.primary{
  background:var(--accent);
  color:#022c22;
  border:none;
}

.signature{
  margin-top:36px;
  font-size:.85rem;
  color:var(--soft);
}
</style>
</head>
<body>

<div class="screen">

  <h1>Abdi Syaif</h1>
  <p>
    Layanan profesional & solusi lapangan<br>
    Wilayah Tolitoli
  </p>

  <div class="options">
    <a class="option primary" href="https://wa.me/6282296066117">
      Saya butuh bantuan sekarang
    </a>

    <a class="option" href="https://wa.me/6282296066117">
      Saya hanya ingin bertanya dulu
    </a>
  </div>

  <div class="signature">
    Komunikasi langsung · Tanpa perantara
  </div>

</div>

</body>
</html>
