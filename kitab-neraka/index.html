</head> <body> <div id="stage"> <div id="scene" class="scene"></div> </div> <script> (function(){ // Neutralize scroll & input window.addEventListener('wheel', e => e.preventDefault(), {passive:false}); window.addEventListener('touchmove', e => e.preventDefault(), {passive:false}); window.addEventListener('keydown', e => { if (["ArrowDown","ArrowUp","PageDown","PageUp"," "].includes(e.key)) { e.preventDefault(); } }); const scenes = [ `KITAB NERAKA`, `diam`, `tidak ada yang perlu dilakukan`, `tidak ada yang perlu dipercepat`, `BAGIAN I — FONDASI KESADARAN`, `Bab 1: Ketika Hidup Tidak Lagi Bisa Diboongi Ada titik dalam hidup ketika penjelasan lama tidak lagi bekerja. Kata-kata yang dulu menenangkan sekarang terdengar kosong. Nasihat yang dulu diyakini kini terasa jauh dari kenyataan batin. Bukan karena hidup menjadi lebih buruk. Justru karena ada kejujuran yang mulai tumbuh.`, `Manusia sering mengira masalahnya ada di luar: keadaan, orang lain, nasib. Padahal yang berubah adalah satu hal sederhana: ia mulai merasakan ketidaksesuaiannya sendiri.`, `Kesalahpahaman umum: banyak orang mengira pencarian diri dimulai karena keinginan menjadi lebih hebat. Kenyataannya, pencarian diri sering dimulai karena tidak sanggup lagi berpura-pura.`, `Pengenalan diri tidak dimulai dari jawaban. Ia dimulai dari keberanian tinggal bersama pertanyaan tanpa kabur.`, `Bab 2: Kesadaran Bukan Sesuatu yang Harus Ditambah Kesadaran bukan benda yang bisa ditambah. Ia bukan keterampilan yang bisa dikuasai. Yang terjadi sebenarnya adalah: kesadaran tertutup oleh kebiasaan bereaksi.`, `Pengenalan diri dimulai saat seseorang berhenti menambah, dan mulai melihat apa yang sudah berlangsung.`, `BAGIAN II — TUBUH, PIKIRAN, DAN PERASAAN`, `Bab 3: Tubuh Tidak Pernah Berbohong Tubuh selalu lebih jujur daripada pikiran. Ia merespons sebelum alasan dibuat.`, `Bab 4: Pikiran Bukan Diri Pikiran muncul, berjalan, lalu menghilang. Diri tidak ikut muncul dan menghilang bersamanya.`, `Bab 5: Perasaan Tidak Butuh Penilaian Perasaan datang tanpa izin. Ia tidak tunduk pada logika.`, `BAGIAN III — EGO DAN TOPENG`, `Bab 6: Ego Tidak Jahat, Tapi Licin Ego bukan musuh. Ia terbentuk untuk melindungi.`, `Bab 7: Topeng yang Dipakai Terlalu Lama Topeng awalnya adalah alat sosial. Lama-lama ia terasa seperti wajah asli.`, `BAGIAN IV — LUKA DAN BAYANGAN DIRI`, `Bab 8: Luka yang Tidak Pernah Pergi Luka yang tidak disadari menentukan cara melihat dunia.`, `Bab 9: Bayangan yang Ditolak Bayangan diri muncul lewat reaksi berlebihan terhadap orang lain.`, `BAGIAN V — KEINGINAN, KETAKUTAN, DAN KELEKATAN`, `Bab 10: Keinginan Tidak Pernah Puas Keinginan bekerja sebagai pengalih perhatian dari kekosongan batin.`, `Bab 11: Ketakutan yang Mengatur Diam-Diam Ketakutan jarang muncul sebagai rasa takut. Ia sering muncul sebagai kontrol.`, `Bab 12: Kelekatan yang Disalahartikan sebagai Cinta Banyak kelekatan memakai nama cinta. Padahal ia lahir dari takut kehilangan diri.`, `BAGIAN VI — KESADARAN DAN PENGAMAT`, `Bab 13: Siapa yang Menyadari? Ketika pikiran diam, sesuatu tetap ada.`, `Bab 14: Hadir Tanpa Menguasai Kesadaran bukan kendali. Ia hanya melihat.`, `BAGIAN VII — KEMATIAN DALAM HIDUP`, `Bab 15: Mati Sebelum Mati Yang mati adalah gambaran diri.`, `Bab 16: Kehilangan yang Membuka Ruang Jika tidak dilawan, kehilangan membuka ruang.`, `BAGIAN VIII — KEHIDUPAN SEHARI-HARI YANG SADAR`, `Bab 17: Hidup Biasa yang Tidak Biasa Kesadaran membuat hidup jujur.`, `Bab 18: Relasi Tanpa Topeng Batin`, `BAGIAN IX — MANUSIA DAN SESUATU YANG MELIPUTINYA`, `Bab 19: Bukan Terpisah, Bukan Melebur`, `Bab 20: Diam yang Tidak Bisa Dijelaskan Ia hanya bisa dialami dalam keheningan jujur.`, `BAGIAN X — PENUTUP TANPA PENUTUP`, `Bab 21: Tidak Ada Akhir Tidak ada yang perlu diikuti. Tidak ada yang perlu dipercaya. Yang ada hanya satu undangan sunyi: lihatlah dirimu sendiri tanpa menambah, tanpa mengurangi. Dan dari sana, hidup berjalan apa adanya.`, `diam`, `tidak ada penutup`, `hanya keheningan` ]; const sceneEl = document
