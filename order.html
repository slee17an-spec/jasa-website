<script>
function updateHarga(){
  const jenis = document.getElementById("jenis").value;
  const hargaEl = document.getElementById("harga");
  const waLink = document.getElementById("waLink");

  let harga = "";
  let pesan = "";

  if(jenis === "landing"){
    harga = "Rp250.000";
    pesan = "Halo,%20saya%20ingin%20pesan%20Landing%20Jasa%20Siap%20WhatsApp.";
  }else if(jenis === "biolink"){
    harga = "Rp150.000";
    pesan = "Halo,%20saya%20ingin%20pesan%20Bio%20Link%20Usaha.";
  }else if(jenis === "bundle"){
    harga = "Rp350.000";
    pesan = "Halo,%20saya%20ingin%20pesan%20Bundle%20UMKM%20Praktis.";
  }else if(jenis === "portfolio"){
    harga = "Rp200.000";
    pesan = "Halo,%20saya%20ingin%20pesan%20Website%20Portofolio.";
  }else if(jenis === "konten"){
    harga = "Rp300.000";
    pesan = "Halo,%20saya%20ingin%20pesan%20Portal%20Konten%20Statis.";
  }else{
    harga = "—";
    pesan = "";
  }

  hargaEl.innerText = harga;
  waLink.href = pesan
    ? "https://wa.me/6282296066117?text=" + pesan
    : "#";
}
</script>
